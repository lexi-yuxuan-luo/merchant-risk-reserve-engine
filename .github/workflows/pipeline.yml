name: pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate synthetic data
        run: python src/generate_data.py
      - name: Train risk models
        run: python src/risk_model.py
      - name: Evaluate reserve policies
        run: python src/policy_engine.py
      - name: Check the committed reports match a fresh run
        # Text reports only: chart pixels can differ slightly across font and library versions.
        run: git diff --exit-code -- 'reports/*.md'
